<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Garmin Dashboard</title>
  <meta name="description" content="Personal Garmin health and training dashboard">
  <meta name="robots" content="noindex, nofollow">
  <!-- Security rule: the browser may only load code, styles, images and data from this site itself.
       If you add an outside resource (font, library, API), add its address here too. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <!-- iPhone "Add to Home Screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Garmin">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lock screen: the data stays encrypted until the passphrase is entered -->
  <main id="lock" class="lock" hidden>
    <form id="lock-form" class="lock-card" autocomplete="on">
      <img src="icons/icon-192.png" alt="" width="64" height="64" class="lock-icon">
      <h1>Garmin Dashboard</h1>
      <p class="muted">Enter your passphrase to unlock your data.</p>
      <input type="text" name="username" value="garmin-dashboard" autocomplete="username" hidden>
      <label class="sr-only" for="pass">Passphrase</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" required>
      <label class="check"><input id="remember" type="checkbox" checked> Remember on this device</label>
      <button type="submit" id="unlock-btn">Unlock</button>
      <p id="lock-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="app" hidden>
    <header class="topbar">
      <div>
        <h1 id="view-title">Today</h1>
        <p id="updated" class="muted small"></p>
      </div>
      <div class="topbar-actions">
        <button id="refresh-btn" class="icon-btn" aria-label="Reload data" title="Reload data">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
        <button id="lock-btn" class="icon-btn" aria-label="Lock" title="Lock and forget passphrase">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </div>
    </header>
    <div id="warnings"></div>
    <main id="view" class="view"></main>
    <nav class="tabbar" aria-label="Sections">
      <button data-tab="today" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
      <button data-tab="sleep"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Sleep</button>
      <button data-tab="activities"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activities</button>
      <button data-tab="trends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Fitness</button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" class="icon-btn" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
