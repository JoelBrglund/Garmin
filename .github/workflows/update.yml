# Fetches Garmin data, encrypts it and publishes the dashboard to GitHub Pages.
# Build tools are locked to exact versions (the long codes) so a hijacked update cannot run here.
# Runs every 3 hours, on every push to main, and when you press "Run workflow" on the Actions tab.
name: Update dashboard

on:
  schedule:
    - cron: "17 */3 * * *"   # minute 17 of every 3rd hour (UTC)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Fetch Garmin data
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          # Optional: Hevy PRO key for strength workouts. Leave the secret unset to skip Hevy.
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: python fetch/fetch_garmin.py

      - name: Encrypt data
        env:
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          # Optional: lets the dashboard's refresh button start this workflow (stored encrypted only).
          DASHBOARD_REFRESH_TOKEN: ${{ secrets.DASHBOARD_REFRESH_TOKEN }}
        run: python fetch/encrypt.py

      - name: Remove unencrypted data before publishing
        run: rm -rf data

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
